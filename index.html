/* Backend Client */
const API_URL='http://localhost:5000/api';
const BC={
  tok:function(){return ld('token',null)},
  h:function(){return{'Content-Type':'application/json','Authorization':'Bearer '+BC.tok()}},
  req:async function(url,m,b){
    try{
      var res=await fetch(API_URL+url,{method:m,headers:BC.h(),body:b?JSON.stringify(b):null});
      if(!res.ok){var err=await res.json();throw new Error(err.error||'Server Error')}
      return await res.json();
    }catch(e){throw e}
  },
  auth:{login:function(em,pw){return BC.req('/auth/login','POST',{email:em,password:pw})},reg:function(nm,em,pw){return BC.req('/auth/register','POST',{name:nm,email:em,password:pw})}},
  get:function(res){return BC.req('/'+res)},
  post:function(res,d){return BC.req('/'+res,'POST',d)},
  patch:function(res,id,d){return BC.req('/'+res+'/'+id,'PATCH',d)},
  del:function(res,id){return BC.req('/'+res+'/'+id,'DELETE')}
};

/* OpenRouter API */
async function callOpenRouter(prompt,hist,key,modelId){
  var k=(key||'').trim();
  if(!k) throw new Error('OpenRouter API key not set. Go to Settings to add it.');
  var msgs=[{role:'system',content:SYS_PROMPT}];
  hist.forEach(function(m){msgs.push({role:m.role,content:m.content})});
  var r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
    body:JSON.stringify({model:modelId||'openai/gpt-4o',messages:msgs,max_tokens:2048,temperature:0.8})
  });
  if(!r.ok){var err=await r.json().catch(function(){return{}});throw new Error((err.error&&err.error.message)||'OpenRouter error ('+r.status+')')}
  var data=await r.json();
  return data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||'No response.';
}

    background:background,setBackground:setBackground,
    notifications:notifications,setNotifications:setNotifications,
    activeMemberId:activeMemberId,setActiveMemberId:setActiveMemberId,
    sessionMemberName:sessionMemberName,
    collapsed:collapsed,mobileOpen:mobileOpen,setMobileOpen:setMobileOpen,
    p2pRole:p2pRole,setP2pRole:setP2pRole,
    p2pRoomId:p2pRoomId,setP2pRoomId:setP2pRoomId,
    p2pConnections:p2pConnections,setP2pConnections:setP2pConnections,
    peer:peer,setPeer:setPeer,
    pendingJoinHost:pendingJoinHost,setPendingJoinHost:setPendingJoinHost,
    joinP2PRoom:joinP2PRoom
  };

  if(page==='landing'&&!user){return e(AppCtx.Provider,{value:ctx},e(LandingPage,{onGetStarted:function(){setPage('auth')}}))}
  if(!user){return e(AppCtx.Provider,{value:ctx},
    authPage==='login'?e(LoginPage,{onSwitch:function(){setAuthPage('register')}}):e(RegisterPage,{onSwitch:function(){setAuthPage('login')}})
  )}

  var pages={dashboard:Dashboard,chat:ChatView,tasks:TaskPage,study:StudyPage,workspaces:WorkspacePage,settings:SettingsPage};
  var PgComp=pages[page]||Dashboard;

  return e(AppCtx.Provider,{value:ctx},
    e('div',{className:'app-layout'},
      e('div',{className:'bg-orbs'},e('div',{className:'bg-orb bg-orb-1'}),e('div',{className:'bg-orb bg-orb-2'}),e('div',{className:'bg-orb bg-orb-3'})),
      e(Sidebar,{collapsed:collapsed,onToggle:function(){setCollapsed(!collapsed)}}),
      e('div',{className:'main-content'},
        e(TopBar),
        page==='chat'?e(PgComp):e('div',{className:'page-container'},e(PgComp)),
        e(InputModal,Object.assign({},pm,{onClose:closePrompt}))
      )
    )
  )
}

/* Mount */
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
